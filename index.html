    <title>Star Wars Memory Game</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <video class="bg-video" autoplay loop muted playsinline>

    <!-- Modal 'Win!' -->
     <!-- class="modal modal--open" aria-hidden="false" -->
    <div class="modal" aria-hidden="true">
      <div class="modal__dialog" role="dialog" aria-modal="true" aria-label="Win!">
        <h2 class="modal__title">Win!</h2>
        <div class="modal__body">
          <div class="win">
            <div class="win__image">
              
            </div>
            <p class="win__message">Matched, all pairs are. May the Force be with you!</p>
            <p class="win__moves">Progress: <span class="win__count-progress">20</span></p>
        </div>
        <div class="modal__actions">
          <button class="btn" type="button">New Game</button
          ><button class="btn btn--close" type="button">Close</button>
        </div>
      </div>
    </div>

    <!-- Modal 'Leaderboard' -->
    <!-- class="modal modal--open" aria-hidden="false" -->
    <div class="modal" aria-hidden="true">
      <div class="modal__dialog" role="dialog" aria-modal="true" aria-label="Leaderboard">
        <h2 class="modal__title">Leaderboard</h2>
        <div class="modal__body">
          <table class="leaderboard">
            <thead>
              <tr>
                <th>Place</th>
                <th>Progress</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>1</td>
                <td>13</td>
                <td>30.09.2026</td>
              </tr>
              <tr>
                <td>2</td>
                <td>16</td>
                <td>01.10.2026</td>
              </tr>
              <tr>
                <td>3</td>

              </tr>
            </tbody>

        </div>
        <div class="modal__actions"><button class="btn btn--close" type="button">Close</button></div>
      </div>
